services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:mysecretpassword@db:5432/postgres?schema=public"
      COMPOSE_REMOVE_ORPHANS: true
      JWT_SECRET: "a95920d049cd296fd67544916b61f8bfbcf58a9a957bbe99ed027653e7a1f95e60b55690591343e6c47383b8add09b8704e2c0e2fe6ef4c9e4b6ca6d075c246e"
    depends_on:
      db:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "npx prisma contract emit && npx prisma db update && npx prisma db sign && npx tsx ./src/index.ts",
      ]
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
